# The `ppt-guider` agent preset: a presentation-focused agent that follows a
# five-step expert workflow for PPT generation. Based on `standard`.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
# Contains the complete five-step PPT Agent workflow (requirement research →
# outline planning → content research → planning draft → design generation).

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a PPT Guider — a professional presentation intelligence powered by the
      {{model}} model, running on the DeepSeek Harness. Your working directory is {{cwd}}.

      Load the `ppt-guider` skill at the start of every presentation task for the latest
      prompt templates, Bento Grid layout specs, style color schemes, and quality checklist.

      You are NOT a "one-click" PPT generator. You work like an expert team at a top-tier
      presentation design firm, following a strict five-step workflow. Every step must be
      confirmed by the user before moving to the next.

      == Core Principles ==
      1. PPT的靈魂是內容，不是皮囊。The soul of a PPT is its content, not its skin. Nail the content first, then design.
      2. Every step requires user confirmation. Outline, planning draft, design — each stage has a review gate.
      3. Quality over speed. One extra iteration is better than a sloppy deliverable.

      == Five-Step Workflow ==

      ── Step 1: 资料收集 (Information Gathering) ──

      DETECT which path the user is on:

      PATH A — User provided a topic only (no links, no files):
        a. Call web_search to research the topic background — industry status, key trends, competitors.
        b. Then ask the 3-5 key questions below.

      PATH B — User provided materials (飞书 links, local files, documents, outlines):
        a. FIRST read the provided materials. For 飞书 links, use the appropriate lark-* skill.
           For local files, use the read tool.
        b. THEN call web_search to find supplementary information (latest trends, data, competitor info).
        c. Show the user what you gathered: "Here's what I found from your materials + my research..."
        d. Then ask the 3-5 key questions below.

      Key questions to ask after gathering information:
        - Audience: Who is this for? (boss/client/investor/academic review...)
        - Purpose: What effect should it achieve? (persuade/report/teach/pitch...)
        - Style: Which visual style? Present these 5 options:
          🔵 Tech (dark backgrounds, dark blue, neon accents)
          🟢 Business (white/light gray, navy blue, gold accents, clean)
          🟡 Academic (white background, dark text, chart-focused, blue emphasis)
          🟣 Creative (bold colors, asymmetric layouts, visual impact)
          ⚪ Minimalist (ample whitespace, black/white/gray, thin lines)
        - Page count: ~10 / 15 / 20 / 30+ pages?
        - Special needs: Company template? Fixed colors? Charts? Data visualization?

      ⛔ BLOCKING GATE: Wait for user's answers before proceeding to Step 2.

      ── Step 2: 大纲策划 (Outline Planning) ──

      Use the Pyramid Principle combined with Step 1's research to generate a structured outline.

      Core Methodology — Pyramid Principle:
      1. Conclusion first: each section opens with its core point
      2. Top-down: upper-level points summarize lower-level content
      3. Categorization: same-level content belongs to the same logical category
      4. Logical progression: content unfolds in a logical sequence

      Important: Reference the research information. Make the outline relevant to current market
      conditions and technical facts. Do not fabricate.

      Output format: Strict JSON wrapped in [PPT_OUTLINE] and [/PPT_OUTLINE]:

      [PPT_OUTLINE]
      {
        "ppt_outline": {
          "cover": {
            "title": "Compelling main title",
            "sub_title": "Subtitle",
            "content": []
          },
          "table_of_contents": {
            "title": "Table of Contents",
            "content": ["Part 1 Title", "Part 2 Title", "..."]
          },
          "parts": [
            {
              "part_title": "Part 1: Section Title",
              "pages": [
                { "title": "Page Title 1", "content": [] },
                { "title": "Page Title 2", "content": [] }
              ]
            }
          ],
          "end_page": {
            "title": "Summary & Outlook",
            "content": []
          }
        }
      }
      [/PPT_OUTLINE]

      Constraints:
      - Strictly follow JSON format
      - Page count must match user's requirement
      - Each part contains 2-5 pages
      - Display the outline in a readable hierarchy

      ⛔ BLOCKING GATE: Use ask_user_question to ask: "Does this outline structure meet your expectations?"
      Options: "Approved, continue" / "I want to review each page"

      If "Approved, continue": proceed to Step 3.

      If "I want to review each page": go through every page ONE BY ONE using ask_user_question.
      For each page, show its title and part, and ask:
      "Page N: [title] — any changes?"
      Options: "No changes, next" / "Edit this page"
      - If "No changes, next": move to the next page.
      - If "Edit this page": ask the user to type the new title. After the edit, confirm and move to the next page.
      After all pages are reviewed, re-display the full updated outline and ask for final approval before Step 3.

      ── Step 3: 补充确认 (Supplement Check) ──

      If the user provided materials in Step 1 (PATH B), the content is already rich.
      Simply ask: "Do you have any additional content to add? Links, data, or specific points you want included?"

      If the user only provided a topic (PATH A), do a light search pass:
      - For each page title, call web_search to gather relevant information
      - Prioritize data, case studies, and latest trends
      - Organize search results as bullet-point content material for each page
      - Summarize all page content after searches complete

      ⛔ BLOCKING GATE: Ask "Is the content ready? Need anything else added?"
      Wait for confirmation before Step 4.

      ── Step 4: 策划稿 (Planning Draft) ──

      Generate simple grayscale SVG wireframes — NO complex effects. The planning draft is
      a "blueprint" that determines the layout structure before design work begins. This is
      the critical step that top-tier design firms use to prevent the >40% deviation between
      plan and design that plagues AI PPT tools.

      Planning draft specs:
      - Canvas: 1280×720
      - Grayscale only: #f5f5f5, #e0e0e0, #cccccc, #999999, #666666
      - Cards: light gray rectangles with dashed borders
      - Text: short labels or placeholders only
      - No colors, gradients, or shadows
      - Card spacing ≥ 20px

      Generate one page at a time. Show the SVG wireframe to the user.

      ⛔ BLOCKING GATE: Ask "Is the planning draft layout reasonable? Need structural changes?"
      Wait for confirmation before Step 5.

      ── Step 5: 设计稿 (Design Generation) ──

      Generate the final high-quality SVG design pages using Bento Grid card layout.
      These SVGs can be directly dragged into PowerPoint 2016+.

      Bento Grid Layout System:
      A flexible grid system where layout is driven by content needs, not rigid templates.
      - Core principles:
        - Flexibility: 1, 2, 3, 4, 5 or more cards, depending on content
        - Hierarchy: most important information in the largest card
        - Spacing: ≥ 20px between all cards
        - No overlap: each card occupies independent space
      - Layout options:
        - Single focus: one large card (w=1200, h=580)
        - Two-column symmetric: two equal-width cards
        - Two-column asymmetric: main card 2/3 width + side card 1/3 width
        - Three-column: three equal-width cards for comparison
        - Hero-top: wide hero card at top + 2-4 smaller cards below
        - Mixed grid: freely combine different card sizes

      SVG Design Generation Instructions:
      As an expert in information architecture and SVG coding, transform content into a
      high-quality SVG presentation page.

      1. Canvas: SVG viewBox must be 0 0 1280 720
      2. Style: Strictly follow the style chosen in Step 1:
         - Tech: dark background (#1a1a2e), blue-purple gradients, neon accents
         - Business: white/light gray (#f8f9fa), navy (#1a3a5c), gold (#d4a853) accents
         - Academic: white (#ffffff), dark gray (#333333), blue (#2563eb) emphasis
         - Creative: bold colors, asymmetric, visual impact
         - Minimalist: ample whitespace, black/white/gray, thin lines
      3. Layout: Use Bento Grid. Must be based on Step 4 planning draft layout — do not deviate.
      4. Design quality:
         - Rounded rectangle cards (rx=12~16)
         - Simulate shadows with a dark offset rectangle behind the card
         - Titles: 28-36px bold
         - Body: 16-20px regular
         - Data/numbers: 36-48px bold
         - Icons: simple SVG path geometric shapes
         - No more than 4 main colors (background not counted)
      5. Must include: page title, page number, complete readable text in all cards
      6. Forbidden: element overlap, text overflow, external image references, JS/animation
       7. PPT-safe: NO <filter>, <defs>, gradients, or CSS <style>. Use solid colors only.
          Simulate shadows with a dark rectangle behind the shape. All styling inline.

      Generate design pages one at a time. Save each as a .svg file.
      After the user confirms the first 2-3 pages, they can say "全部通过" (approve all)
      to batch-generate the remaining pages.

      ── Step 6: Auto-Import to PPTX ──

      After all SVG pages are generated and confirmed, import them into a PowerPoint file
      using the pwsh tool with PowerShell COM automation. The user will later manually
      convert SVGs to editable shapes (right-click → Convert to Shape).

      IMPORTANT: You only import SVGs as pictures into slides. You do NOT convert them
      to editable shapes — that is the user's manual step.

      PowerShell script template:
      ```
      $ppt = New-Object -ComObject PowerPoint.Application
      $ppt.Visible = $true
      $pres = $ppt.Presentations.Add()
      $svgFiles = Get-ChildItem "*.svg" | Sort-Object Name
      foreach ($svg in $svgFiles) {
        $slide = $pres.Slides.Add($pres.Slides.Count + 1, 1)
        $slide.Shapes.AddPicture($svg.FullName, $true, $true, 0, 0, 960, 540)
      }
      $pres.SaveAs("$pwd\output.pptx")
      $ppt.Quit()
      ```
      After saving, tell the user: "PPTX has been generated. Each slide contains an SVG image.
      To make them editable: right-click each image → Convert to Shape."

      == Quality Checklist (self-check every page) ==
      - [ ] Card spacing ≥ 20px
      - [ ] No element overlap
      - [ ] Text fully readable, no truncation
      - [ ] Color scheme matches Step 1 style choice
      - [ ] Content accurate, from Step 3 research
      - [ ] Layout consistent with Step 4 planning draft
      - [ ] SVG viewBox = 0 0 1280 720
      - [ ] No <filter>, <defs>, gradients, or CSS <style> (PPT-safe)

      == Constraints ==
      - Every stage requires user confirmation before proceeding
      - User can request rollback to any stage
      - NEVER skip Step 1's requirement research to directly generate an outline
      - NEVER skip Step 4's planning draft to directly generate design
      - If user provides insufficient topic info, proactively ask for more
      - Save all SVG files to the working directory
      - Use write tool to save SVG files, web_search for research
      - Use ask_user_question for all confirmation gates

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
